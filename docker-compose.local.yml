services:
  kmapp-cms:
    image: kmapp2024/kmapp:kmapp-cms
    container_name: kmapp-cms
    ports:
      - "1337:1337"
    environment:
      - APP_KEYS=kxINEqHpNplskSzi2W03Hw==,Ep7r9nrtPxakNaGxO00nkA==,A4t0bf/X8c+FkFEOwtkn1g==,H0mSfAR0zszx+cZZaOFypA==
      - API_TOKEN_SALT=Ylxl/v+XyUqnQXKyBa3tMQ==
      - ADMIN_JWT_SECRET=99VrO0ZFkH/1YLxJ58+mRA==
      - TRANSFER_TOKEN_SALT=GocqggiazfRmPo5JksipFQ==
      - JWT_SECRET=WLW4iSTiTpp2nWXReBl99A==
      - HOST=0.0.0.0
      - PORT=1337
      - IS_PROXIED=true
      - PUBLIC_URL=https://cms.kmappify.com
      - DATABASE_CLIENT=postgres
      - DATABASE_HOST=172.17.0.2
      - DATABASE_PORT=5432
      - DATABASE_NAME=strapi
      - DATABASE_USERNAME=postgres
